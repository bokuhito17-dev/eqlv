name: Daily Equal Love Check

on:
  schedule:
    # 毎日 日本時間21:00（UTC 12:00）
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Validate Python syntax
        run: python -m py_compile check.py

      - name: Run check script
        env:
          DISCORD_VIDEO_WEBHOOK_URL: ${{ secrets.DISCORD_VIDEO_WEBHOOK_URL }}
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
        run: python check.py

      # Even if a later notification fails, save history for messages
      # that were already delivered successfully.
      - name: Commit updated history
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add notified.json video_baseline.json
          git diff --cached --quiet || (git commit -m "Update notified history" && git push)
