name: Daily Equal Love Check

on:
  schedule:
    # 毎日 日本時間 21:00（UTC 12:00）に実行
    - cron: '0 12 * * *'
  # 手動でテスト実行するためのボタンを有効化
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Run check script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERROR: Secret is empty"
            exit 1
          else
            echo "SUCCESS: Secret is available"
          fi

      - name: Commit updated history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add notified.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update notified history" && git push)
