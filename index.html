<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無菌専用プレイヤー</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      margin-bottom: 20px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .song-list {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    button {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }
    button:hover {
      background-color: #e91e63;
      border-color: #e91e63;
    }
  </style>
</head>
<body>

  <h3>🎤 コール練習＆公式動画プレイヤー</h3>

  <div class="video-container">
    <iframe id="player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <!-- 東京ドームのコール練習用プリセット（動画IDを書き換えて追加可能） -->
  <div class="song-list">
    <button onclick="playVideo('ここに動画IDを入れる')">🎵 コール練習曲 1</button>
    <button onclick="playVideo('ここに動画IDを入れる')">🎵 コール練習曲 2</button>
  </div>

  <script>
    function playVideo(videoId) {
      if (!videoId) return;
      const embedUrl = `https://youtube-nocookie.com{videoId}?rel=0&modestbranding=1&autoplay=1`;
      document.getElementById('player').src = embedUrl;
    }

    // URLに ?v=動画ID がついている場合は自動で再生セットする
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get('v');
      if (videoId) {
        playVideo(videoId);
      }
    };
  </script>

</body>
</html>
