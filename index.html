<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>YouTubeプレーヤー</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h3 {
      width: 100%;
      max-width: 800px;
      margin: 8px 0 16px;
    }
    .video-container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      margin-bottom: 12px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .video-form {
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 8px;
      margin: 8px 0 12px;
    }
    .video-form input {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #242424;
      color: #fff;
      font-size: 14px;
    }
    .video-form input:focus {
      outline: 2px solid #e91e63;
      outline-offset: 1px;
    }
    .video-form button {
      background-color: #e91e63;
      color: #fff;
      border: 1px solid #e91e63;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    .video-form button:hover {
      background-color: #c2185b;
    }
    #player-status {
      width: 100%;
      max-width: 800px;
      min-height: 1.5em;
      margin: 0 0 20px;
      color: #bdbdbd;
      font-size: 14px;
    }
    @media (max-width: 420px) {
      .video-form {
        flex-direction: column;
      }
      .video-form button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h3>YouTubeプレーヤー</h3>

  <div class="video-container">
    <iframe
      id="player"
      src=""
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <form class="video-form" id="video-form">
    <input
      id="video-url"
      type="text"
      inputmode="text"
      placeholder="YouTube動画IDまたはリンクを貼り付け"
      aria-label="YouTube動画IDまたはリンク"
      autocomplete="off"
      required>
    <button type="submit">再生</button>
  </form>

  <p id="player-status" role="status" aria-live="polite">
    YouTube動画ID（11文字）または動画リンクを貼り付けると、上のプレーヤーで再生できます。
  </p>

  <script>
    const VIDEO_ID_PATTERN = /^[0-9A-Za-z_-]{11}$/;

    function extractVideoId(value) {
      const input = (value || "").trim();

      // 動画IDだけが入力された場合
      if (VIDEO_ID_PATTERN.test(input)) return input;

      let url;
      try {
        url = new URL(input);
      } catch {
        return null;
      }

      const host = url.hostname.toLowerCase();
      const allowedHosts = [
        "youtube.com",
        "www.youtube.com",
        "m.youtube.com",
        "youtu.be",
        "www.youtu.be",
        "youtube-nocookie.com",
        "www.youtube-nocookie.com"
      ];

      if (!allowedHosts.includes(host)) return null;

      let videoId = null;

      if (host === "youtu.be" || host === "www.youtu.be") {
        videoId = url.pathname.split("/").filter(Boolean)[0];
      } else if (url.pathname === "/watch") {
        videoId = url.searchParams.get("v");
      } else {
        const pathParts = url.pathname.split("/").filter(Boolean);
        if (["shorts", "embed", "live"].includes(pathParts[0])) {
          videoId = pathParts[1];
        }
      }

      return VIDEO_ID_PATTERN.test(videoId || "") ? videoId : null;
    }

    function playVideo(videoId) {
      const status = document.getElementById("player-status");
      const player = document.getElementById("player");

      if (!VIDEO_ID_PATTERN.test(videoId || "")) {
        status.textContent = "YouTube動画IDを確認してください。";
        return false;
      }

      const embedUrl =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(videoId) +
        "?rel=0&modestbranding=1&playsinline=1&autoplay=1";

      player.src = embedUrl;
      status.textContent =
        "動画を読み込みました。自動再生されない場合は、プレーヤーの再生ボタンを押してください。";
      return true;
    }

    function playFromInput() {
      const input = document.getElementById("video-url");
      const videoId = extractVideoId(input.value);

      if (!videoId) {
        document.getElementById("player-status").textContent =
          "有効なYouTube動画ID（11文字）または動画リンクを入力してください。";
        return;
      }

      playVideo(videoId);
    }

    document.getElementById("video-form").addEventListener("submit", function (event) {
      event.preventDefault();
      playFromInput();
    });

    // 動画IDまたはリンクを貼り付けたとき、そのままプレーヤーに読み込む
    document.getElementById("video-url").addEventListener("paste", function () {
      const input = this;
      setTimeout(function () {
        if (extractVideoId(input.value)) {
          playFromInput();
        }
      }, 0);
    });

    window.addEventListener("DOMContentLoaded", function () {
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get("v");

      if (videoId) {
        playVideo(videoId);
      }
    });
  </script>

</body>
</html>
