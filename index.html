<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>無菌専用プレイヤー</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      margin-bottom: 12px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #player-status {
      width: 100%;
      max-width: 800px;
      min-height: 1.5em;
      margin: 0 0 20px;
      color: #bdbdbd;
      font-size: 14px;
    }
    .song-list {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    button {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }
    button:hover {
      background-color: #e91e63;
      border-color: #e91e63;
    }
  </style>
</head>
<body>

  <h3>🎤 コール練習＆公式動画プレイヤー</h3>

  <div class="video-container">
    <iframe
      id="player"
      src=""
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>
  <p id="player-status" role="status" aria-live="polite">
    Discordの新着動画通知から開くと、対象動画がここに表示されます。
  </p>

  <!-- 東京ドームのコール練習用プリセット（動画IDを書き換えて追加可能） -->
  <div class="song-list">
    <button onclick="playVideo('ここに動画IDを入れる')">🎵 コール練習曲 1</button>
    <button onclick="playVideo('ここに動画IDを入れる')">🎵 コール練習曲 2</button>
  </div>

  <script>
    const VIDEO_ID_PATTERN = /^[0-9A-Za-z_-]{11}$/;

    function playVideo(videoId) {
      const status = document.getElementById("player-status");
      const player = document.getElementById("player");

      if (!VIDEO_ID_PATTERN.test(videoId || "")) {
        status.textContent = "動画IDが正しくありません。Discordの新着動画通知から開いてください。";
        return;
      }

      const embedUrl =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(videoId) +
        "?rel=0&modestbranding=1&playsinline=1&autoplay=1";

      player.src = embedUrl;
      status.textContent =
        "動画を読み込みました。自動再生がブロックされた場合は、プレイヤーの再生ボタンを押してください。";
    }

    window.addEventListener("DOMContentLoaded", function () {
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get("v");

      if (videoId) {
        playVideo(videoId);
      }
    });
  </script>

</body>
</html>
